# Cloudflare Deployment Configuration for Breezing Status HD
name = "breezing-status-hd"
compatibility_date = "2024-09-23"

# Build the frontend for direct Wrangler deployments too.
[build]
command = "npm run build"

# Cloudflare Static Assets configuration
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
